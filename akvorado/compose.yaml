services:
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - 127.0.0.1:9092:9092/tcp
    healthcheck:
      interval: 20s
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--list", "--bootstrap-server", "kafka:9092"]

  redis:
    image: valkey/valkey:9.0
    restart: unless-stopped
    healthcheck:
      interval: 20s
      test: ["CMD-SHELL", "timeout 3 valkey-cli ping | grep -q PONG"]

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    restart: unless-stopped
    environment:
      CLICKHOUSE_INIT_TIMEOUT: 60
      CLICKHOUSE_SKIP_USER_SETUP: 1
    cap_add:
      - SYS_NICE
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      interval: 20s
      test: ["CMD", "wget", "-T", "1", "--spider", "--no-proxy", "http://127.0.0.1:8123/ping"]

  akvorado-orchestrator:
    image: quay.io/akvorado/akvorado:main
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    command: orchestrator /etc/akvorado/akvorado.yaml
    volumes:
      - ./config:/etc/akvorado:ro
    ports:
      - 127.0.0.1:18080:8080/tcp

  akvorado-console:
    image: quay.io/akvorado/akvorado:main
    restart: unless-stopped
    depends_on:
      akvorado-orchestrator:
        condition: service_started
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    command: console http://akvorado-orchestrator:8080
    environment:
      AKVORADO_CFG_CONSOLE_DATABASE_DSN: /run/akvorado/console.sqlite
    volumes:
      - console-db:/run/akvorado
    ports:
      - 8081:8080/tcp

  akvorado-outlet:
    image: quay.io/akvorado/akvorado:main
    restart: unless-stopped
    depends_on:
      akvorado-orchestrator:
        condition: service_started
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    command: outlet http://akvorado-orchestrator:8080
    environment:
      AKVORADO_CFG_OUTLET_METADATA_CACHEPERSISTFILE: /run/akvorado/metadata.cache
      AKVORADO_CFG_OUTLET_FLOW_STATEPERSISTFILE: /run/akvorado/flow.state
    volumes:
      - akvorado-run:/run/akvorado

  akvorado-inlet:
    image: quay.io/akvorado/akvorado:main
    restart: unless-stopped
    depends_on:
      akvorado-orchestrator:
        condition: service_started
      kafka:
        condition: service_healthy
    command: inlet http://akvorado-orchestrator:8080
    ports:
      - 6343:6343/udp
    volumes:
      - akvorado-run:/run/akvorado

volumes:
  kafka-data:
  clickhouse-data:
  console-db:
  akvorado-run: