---
kafka:
  topic: flows
  brokers:
    - kafka:9092
  topic-configuration:
    num-partitions: 1
    replication-factor: 1
    config-entries:
      retention.ms: 259200000
      cleanup.policy: delete
      compression.type: producer

clickhousedb:
  servers:
    - clickhouse:9000
  database: default
  username: default
  password: ""

inlet: !include "inlet.yaml"
outlet: !include "outlet.yaml"
console: !include "console.yaml"